<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="chatStyle.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" crossorigin="anonymous">
</head>

<body>
    <div id="chat-container">
        <div id="sidebar">

            <div id="perfil-usuario">
                <img id="avatar-usuario" src="./assets/img/avatar.jpg" alt="Avatar del usuario">
                <h4 id="nombre-usuario"></h4>
                <div class="menu-container">
                    <span class="icono-tres-puntos">&#8942;</span>
                    <div class="menu-content">
                        <a href="#" onclick="cerrarSesion(event)">Cerrar sesión</a>
                    </div>
                </div>
            </div>

            <div class="modal" id="loadingModal">
                <div class="modal-content">
                    <h3>Cerrando sesión, por favor espera...</h3>
                    <div class="spinner"></div>
                </div>
            </div>

            <h2 id="volverChatPublico" class="actual">Chat Público</h2><br>
            <h3>Usuarios conectados</h3>
            <hr>
            <div id="listaUsuarios">
                <ul id="usuariosConectados">

                </ul>
            </div>
        </div>

        <div id="contenido-principal">
            <div class="encabezado-chat">
                <h2 id="encabezado">Chat Público</h2>
            </div>
            <div class="ventana-chat publico">
                <div id="mensajes-chat">
                    <ul id="chat_publico">

                    </ul>
                </div>
            </div>
            <div id="chat-input">
                <div class="input-container">
                    <form id="form">
                        <input id="input" type="textarea" autocomplete="off" placeholder="Escribe un mensaje">
                        <button>Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="chatScript.js"></script>
</body>

</html>

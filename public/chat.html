<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="chatStyle.css">
</head>

<body>
    <div id="chat-container">
        <div id="sidebar">
            <h2 id="volverChatPublico" class="actual">Chat Público</h2><br>
            <h3>Usuarios conectados</h3>
            <hr>
            <div id="listaUsuarios">
                <ul id="usuariosConectados">

                </ul>
            </div>
        </div>

        <div id="contenido-principal">
            <div class="encabezado-chat">
                <h2 id="encabezado">Chat Público</h2>
            </div>
            <div class="ventana-chat publico">
                <div id="mensajes-chat">
                    <ul id="chat_publico">

                    </ul>
                </div>
            </div>
            <div id="chat-input">
                <div class="input-container">
                    <form id="form">
                        <input id="input" type="text" autocomplete="off" placeholder="Escribe un mensaje">
                        <button>Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script><!--Esto es necesario para conectar con el servidor-->
    <script src="chatScript.js"></script>
</body>

</html>
